# Central configuration for paths and experiment settings

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: models
  reports: reports
  figures: reports/figures

data:
  text_column: text
  label_column: label        # 1 = spam, 0 = ham
  test_size: 0.15
  val_size: 0.15
  random_state: 42

preprocessing:
  lowercase: true            # applied to lemmas/stems; the cleaned text keeps its case
  normalize_diacritics: true
  replace_urls: true
  replace_emails: true
  replace_money: true
  replace_numbers: true
  remove_stopwords: true
  stanza_use_gpu: true

tfidf:
  word_ngram_range: [1, 2]
  char_ngram_range: [3, 5]
  max_features: 50000
  min_df: 2

# Each grid is searched with 5-fold CV on the train split (spam F1).
baselines:
  naive_bayes_alpha: [0.01, 0.1, 1.0]
  logreg_c: [1, 10, 100]
  svm_c: [0.1, 1, 10]

fasttext:
  vectors_url: https://dl.fbaipublicfiles.com/fasttext/vectors-crawl/cc.ro.300.vec.gz
  top_n_words: 200000        # most frequent words kept besides the corpus vocabulary, for unseen emails in the demo
  logreg_c: [0.01, 0.1, 1, 10]

ablation:
  logreg_c_grid: [1, 10, 100]  # chosen once on the TF-IDF-only model, then fixed for every feature set

bert:
  model_name: dumitrescustefan/bert-base-romanian-cased-v1
  max_length: 256
  batch_size: 16
  epochs: 5                  # val F1: 0.953 with 3 epochs, 0.986 with 5, 0.979 with 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
